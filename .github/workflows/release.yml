name: CI and deploy Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flova-docs-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run types:check
      - run: npm run build
      - name: Validate production Compose
        run: |
          env_file="$RUNNER_TEMP/flova-docs-compose.env"
          printf '%s\n' \
            'FLOVA_EDGE_NETWORK=flova_edge' \
            'DOCS_IMAGE=ghcr.io/example/flova-docs:test' > "$env_file"
          docker compose --env-file "$env_file" -f docker-compose.production.yml config --quiet
      - name: Validate Docker image build
        run: docker build --tag flova-docs:ci .

  publish:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=main-${{ github.sha }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [verify, publish]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.DOCS_HOSTNAME }}
    permissions:
      contents: read
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
      DOCS_HOSTNAME: ${{ vars.DOCS_HOSTNAME }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.repository_owner }}
      DOCS_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate deployment variables
        run: |
          set -euo pipefail
          for key in VPS_HOST VPS_USER VPS_APP_DIR DOCS_HOSTNAME; do
            [[ -n "${!key:-}" ]] || { echo "Missing GitHub production variable: $key" >&2; exit 1; }
          done
      - name: Prepare SSH trust and key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/flova-ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/flova-ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/flova-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/flova-ssh/id_ed25519" "$RUNNER_TEMP/flova-ssh/known_hosts"
      - name: Authenticate VPS to GHCR
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          ssh_args=(-i "$RUNNER_TEMP/flova-ssh/id_ed25519" -o UserKnownHostsFile="$RUNNER_TEMP/flova-ssh/known_hosts" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          printf '%s' "$GHCR_READ_TOKEN" | ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
      - name: Check VPS prerequisites
        run: |
          set -euo pipefail
          ssh_args=(-i "$RUNNER_TEMP/flova-ssh/id_ed25519" -o UserKnownHostsFile="$RUNNER_TEMP/flova-ssh/known_hosts" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" bash -s -- <<'REMOTE'
          set -euo pipefail
          docker compose version >/dev/null
          docker network inspect flova_edge >/dev/null
          docker inspect flova-caddy >/dev/null
          REMOTE
      - name: Upload and deploy
        run: |
          set -euo pipefail
          ssh_args=(-i "$RUNNER_TEMP/flova-ssh/id_ed25519" -o UserKnownHostsFile="$RUNNER_TEMP/flova-ssh/known_hosts" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_APP_DIR' && chmod 700 '$VPS_APP_DIR'"
          scp "${ssh_args[@]}" docker-compose.production.yml "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/"
          compose="docker compose --env-file /dev/null -f '$VPS_APP_DIR/docker-compose.production.yml'"
          ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "DOCS_IMAGE='$DOCS_IMAGE' $compose config >/dev/null"
          previous_image="$(ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "cat '$VPS_APP_DIR/.last-good-image' 2>/dev/null || true")"
          if ! ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "DOCS_IMAGE='$DOCS_IMAGE' $compose pull && DOCS_IMAGE='$DOCS_IMAGE' $compose up -d --remove-orphans --wait --wait-timeout 180"; then
            ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "$compose logs --tail=100" || true
            if [[ -n "$previous_image" ]]; then
              ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "DOCS_IMAGE='$previous_image' $compose up -d --remove-orphans --wait --wait-timeout 180" || true
            fi
            exit 1
          fi
          ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "printf '%s\\n' '$DOCS_IMAGE' > '$VPS_APP_DIR/.last-good-image'; chmod 600 '$VPS_APP_DIR/.last-good-image'; DOCS_IMAGE='$DOCS_IMAGE' $compose ps"
      - name: Verify public docs
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --max-time 15 "https://${DOCS_HOSTNAME}/fa/docs/" >/dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --max-time 15 "https://${DOCS_HOSTNAME}/en/docs/" >/dev/null
      - if: always()
        run: rm -f "$RUNNER_TEMP/flova-ssh/id_ed25519" "$RUNNER_TEMP/flova-ssh/known_hosts"
