openapi: 3.1.0
info:
  title: Flova Organization API
  version: 1.0.0
  description: Organization-scoped device, template, datastream, provisioning, and realtime API.
servers:
  - url: /api/v1
security:
  - organizationApiKey: []
  - organizationOAuth: []
paths:
  /devices:
    get:
      operationId: listDevices
      x-flova-scope: devices:read
      responses: {"200": {$ref: "#/components/responses/Success"}}
    post:
      operationId: createDevice
      x-flova-scope: devices:write
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {$ref: "#/components/requestBodies/JsonBody"}
      responses: {"200": {$ref: "#/components/responses/Success"}}
  /devices/{deviceId}:
    parameters: [{$ref: "#/components/parameters/DeviceId"}]
    get:
      operationId: getDevice
      x-flova-scope: devices:read
      responses: {"200": {$ref: "#/components/responses/Success"}, "404": {$ref: "#/components/responses/Error"}}
    patch:
      operationId: updateDevice
      x-flova-scope: devices:write
      requestBody: {$ref: "#/components/requestBodies/JsonBody"}
      responses: {"200": {$ref: "#/components/responses/Success"}}
    delete:
      operationId: archiveDevice
      x-flova-scope: devices:write
      responses: {"200": {$ref: "#/components/responses/Success"}}
  /devices/{deviceId}/activation-code:
    parameters: [{$ref: "#/components/parameters/DeviceId"}]
    get:
      operationId: getActivationCode
      x-flova-scope: provisioning:read
      responses: {"200": {$ref: "#/components/responses/Success"}}
  /devices/{deviceId}/activation-codes:
    parameters: [{$ref: "#/components/parameters/DeviceId"}]
    post:
      operationId: regenerateActivationCode
      x-flova-scope: provisioning:write
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses: {"200": {$ref: "#/components/responses/Success"}}
  /device-batches/{batchId}/export:
    parameters: [{name: batchId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: exportDeviceBatch
      x-flova-scope: provisioning:read
      responses: {"200": {$ref: "#/components/responses/Success"}}
  /devices/{deviceId}/datastreams:
    parameters: [{$ref: "#/components/parameters/DeviceId"}]
    get:
      operationId: listDeviceDatastreamValues
      x-flova-scope: datastreams:read
      responses: {"200": {$ref: "#/components/responses/Success"}}
  /devices/{deviceId}/datastreams/{key}:
    parameters: [{$ref: "#/components/parameters/DeviceId"}, {$ref: "#/components/parameters/DatastreamKey"}]
    get:
      operationId: getDeviceDatastreamValue
      x-flova-scope: datastreams:read
      responses: {"200": {$ref: "#/components/responses/Success"}, "404": {$ref: "#/components/responses/Error"}}
  /devices/{deviceId}/datastreams/{key}/value:
    parameters: [{$ref: "#/components/parameters/DeviceId"}, {$ref: "#/components/parameters/DatastreamKey"}, {$ref: "#/components/parameters/IdempotencyKey"}]
    post:
      operationId: writeDeviceDatastreamValue
      x-flova-scope: datastreams:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties: {value: {}}
      responses: {"202": {$ref: "#/components/responses/Success"}, "422": {$ref: "#/components/responses/Error"}}
  /templates:
    get:
      operationId: listTemplates
      x-flova-scope: templates:read
      responses: {"200": {$ref: "#/components/responses/Success"}}
    post:
      operationId: createTemplate
      x-flova-scope: templates:write
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {$ref: "#/components/requestBodies/JsonBody"}
      responses: {"200": {$ref: "#/components/responses/Success"}}
  /templates/{templateId}:
    parameters: [{$ref: "#/components/parameters/TemplateId"}]
    get: {operationId: getTemplate, x-flova-scope: "templates:read", responses: {"200": {$ref: "#/components/responses/Success"}}}
    patch: {operationId: updateTemplate, x-flova-scope: "templates:write", requestBody: {$ref: "#/components/requestBodies/JsonBody"}, responses: {"200": {$ref: "#/components/responses/Success"}}}
    delete: {operationId: archiveTemplate, x-flova-scope: "templates:write", responses: {"200": {$ref: "#/components/responses/Success"}}}
  /templates/{templateId}/datastreams:
    parameters: [{$ref: "#/components/parameters/TemplateId"}]
    get: {operationId: listDatastreams, x-flova-scope: "datastreams:read", responses: {"200": {$ref: "#/components/responses/Success"}}}
    post: {operationId: createDatastream, x-flova-scope: "datastreams:manage", parameters: [{$ref: "#/components/parameters/IdempotencyKey"}], requestBody: {$ref: "#/components/requestBodies/JsonBody"}, responses: {"201": {$ref: "#/components/responses/Success"}}}
  /templates/{templateId}/datastreams/{id}:
    parameters: [{$ref: "#/components/parameters/TemplateId"}, {name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {operationId: getDatastream, x-flova-scope: "datastreams:read", responses: {"200": {$ref: "#/components/responses/Success"}}}
    patch: {operationId: updateDatastream, x-flova-scope: "datastreams:manage", requestBody: {$ref: "#/components/requestBodies/JsonBody"}, responses: {"200": {$ref: "#/components/responses/Success"}}}
    delete: {operationId: deleteDatastream, x-flova-scope: "datastreams:manage", responses: {"204": {description: Deleted}}}
  /templates/{templateId}/pins:
    parameters: [{$ref: "#/components/parameters/TemplateId"}]
    get: {operationId: listPins, x-flova-scope: "templates:read", responses: {"200": {$ref: "#/components/responses/Success"}}}
    post: {operationId: createPin, x-flova-scope: "templates:write", parameters: [{$ref: "#/components/parameters/IdempotencyKey"}], requestBody: {$ref: "#/components/requestBodies/JsonBody"}, responses: {"201": {$ref: "#/components/responses/Success"}}}
  /templates/{templateId}/pins/{id}:
    parameters: [{$ref: "#/components/parameters/TemplateId"}, {name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {operationId: getPin, x-flova-scope: "templates:read", responses: {"200": {$ref: "#/components/responses/Success"}}}
    patch: {operationId: updatePin, x-flova-scope: "templates:write", requestBody: {$ref: "#/components/requestBodies/JsonBody"}, responses: {"200": {$ref: "#/components/responses/Success"}}}
    delete: {operationId: deletePin, x-flova-scope: "templates:write", responses: {"204": {description: Deleted}}}
  /realtime:
    get:
      operationId: connectRealtime
      x-flova-scope: realtime:read
      security: [{realtimeTicket: []}]
      description: Upgrade to a plain WebSocket. Send subscribe, unsubscribe, and ping JSON messages.
      responses: {"101": {description: WebSocket upgraded}}
  /realtime/tickets:
    post:
      operationId: createRealtimeTicket
      x-flova-scope: realtime:read
      description: Returns a 60-second ticket for browser WebSocket clients that cannot set an Authorization upgrade header.
      responses: {"200": {$ref: "#/components/responses/Success"}}
  /flovaql/query:
    post:
      operationId: queryFlovaQL
      x-flova-scope: flovaql:read
      requestBody: {$ref: "#/components/requestBodies/JsonBody"}
      responses: {"200": {$ref: "#/components/responses/Success"}}
  /flovaql/validate:
    post:
      operationId: validateFlovaQL
      x-flova-scope: flovaql:read
      requestBody: {$ref: "#/components/requestBodies/JsonBody"}
      responses: {"200": {$ref: "#/components/responses/Success"}}
  /flovaql/catalog:
    get:
      operationId: getFlovaQLCatalog
      x-flova-scope: flovaql:read
      responses: {"200": {$ref: "#/components/responses/Success"}}
components:
  securitySchemes:
    organizationApiKey:
      type: http
      scheme: bearer
      bearerFormat: flv_live
    organizationOAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.flova.ir/api/auth/oauth2/token
          scopes:
            devices:read: Read organization devices
            devices:write: Manage organization devices
            provisioning:read: Read activation handoff state
            provisioning:write: Manage activation handoff state
            templates:read: Read templates
            templates:write: Manage templates
            datastreams:read: Read datastreams
            datastreams:write: Write datastream values
            datastreams:manage: Manage datastream definitions
            flovaql:read: Query organization data
            telemetry:read: Read telemetry
            logs:read: Read logs
            realtime:read: Use organization realtime
    realtimeTicket:
      type: apiKey
      in: query
      name: ticket
  parameters:
    DeviceId: {name: deviceId, in: path, required: true, schema: {type: string, format: uuid}}
    TemplateId: {name: templateId, in: path, required: true, schema: {type: string, format: uuid}}
    DatastreamKey: {name: key, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 200}}
  requestBodies:
    JsonBody:
      required: true
      content: {application/json: {schema: {type: object, additionalProperties: true}}}
  responses:
    Success:
      description: Successful response
      content: {application/json: {schema: {type: object, additionalProperties: true}}}
    Error:
      description: Error response
      headers:
        x-request-id: {schema: {type: string}, description: Request correlation identifier}
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, details]
                properties: {code: {type: string}, message: {type: string}, details: {type: object}}
